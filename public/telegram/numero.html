<!doctype html>
<!--
  public/telegram/numero.html — Mini app de Telegram para compartir el número.

  El bot la abre con un botón web_app pegado al mensaje que pide el número
  (lib/auth/telegram-login/handler.ts). Llama a Telegram.WebApp.requestContact:
  Telegram muestra su ventana nativa y, si la persona acepta, manda el contacto
  al chat del bot como un mensaje normal. El webhook lo recibe igual que el del
  teclado «Compartir mi número»: esta página no manda nada a nuestro servidor,
  no lee datos de la persona y no necesita sesión.

  Headers propios en next.config.mjs (frame-ancestors para Telegram Web y el
  script de telegram.org). Archivo estático: el middleware no lo toca.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Compartir mi número</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0e1420);
    --text: var(--tg-theme-text-color, #f5f7fa);
    --hint: var(--tg-theme-hint-color, #aeb7c7);
    --button: var(--tg-theme-button-color, #2aabee);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 12px; }
  p { margin: 0 0 20px; color: var(--hint); overflow-wrap: anywhere; }
  button {
    display: block;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    font-weight: 600;
    background: var(--button);
    color: var(--button-text);
    cursor: pointer;
  }
  button + button { margin-top: 12px; background: transparent; color: var(--button); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Compartir mi número</h1>
  <p id="text">Un momento…</p>
  <button id="share" type="button" hidden>Compartir mi número</button>
  <button id="close" type="button" hidden>Volver al chat</button>
</main>
<script src="/telegram/numero.js"></script>
</body>
</html>
