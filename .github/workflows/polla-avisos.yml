# Avisos de pollas por WhatsApp, cada hora.
#
# Pega POST a /api/cron/polla-avisos al minuto 10 de cada hora. El endpoint
# verifica el bearer token con requireCronSecret y avisa a los jugadores de
# pollas que cierran en menos de 3 h y de pollas nuevas (una vez por persona y
# polla). Con WhatsApp apagado responde {"ok":true,"disabled":true}.
#
# El paso falla si la respuesta no es 2xx, el body no trae "ok": true o curl
# pasa de 280 s. En el log solo se imprimen contadores (repo público).
# Sin --retry: los envíos no son idempotentes a mitad de corrida.

name: Polla Avisos Hourly

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cron-whatsapp-avisos
  cancel-in-progress: false

jobs:
  send-avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: POST a la API de avisos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_URL:=https://lapollacolombiana.com}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET no está configurado en los secrets del repo"
            exit 1
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl -sS --max-time 280 -o "$body_file" -w '%{http_code}' -X POST \
            "$APP_URL/api/cron/polla-avisos" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")"
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            error_code="$(jq -r '.error // empty | tostring | .[0:80]' "$body_file" 2>/dev/null || true)"
            echo "::error::El cron respondió HTTP $status (se esperaba 2xx) ${error_code:+error=$error_code}"
            exit 1
          fi
          if ! jq -e '.ok == true' "$body_file" > /dev/null 2>&1; then
            echo "::error::La respuesta no trae \"ok\": true"
            exit 1
          fi
          jq -c '{ok, disabled, sent, skipped, failed, capped, closing, fresh, total_candidates, errors: ((.errors // []) | length)}' "$body_file"
