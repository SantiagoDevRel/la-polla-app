# Daily match reminders cron.
#
# Pega POST a /api/cron/match-reminders todos los dias a las 13:00 UTC
# (8:00 am Bogota, UTC-5). El endpoint verifica el bearer token con
# requireCronSecret (lib/auth/cron-secret.ts) y manda template messages a
# usuarios con partidos hoy. Con WhatsApp apagado responde
# {"ok":true,"disabled":true} sin enviar nada.
#
# El paso falla si: la respuesta no es 2xx (un 307 a /login también es
# fallo: hasta 2026-09-13 el middleware redirigía y el job quedaba verde),
# el body no trae "ok": true, o curl pasa de 90 s. En el log solo se
# imprimen contadores: el repo es público y el body puede traer user_id.
# Sin --retry: los envíos no son idempotentes.
#
# workflow_dispatch permite triggear manual desde la UI de GitHub o
# `gh workflow run match-reminders.yml` para testing.

name: Match Reminders Daily

on:
  schedule:
    # 13:00 UTC = 8:00 AM Bogota (Colombia, UTC-5, no DST)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cron-match-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST a la API de reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_URL:=https://lapollacolombiana.com}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET no está configurado en los secrets del repo"
            exit 1
          fi
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl -sS --max-time 90 -o "$body_file" -w '%{http_code}' -X POST \
            "$APP_URL/api/cron/match-reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")"
          echo "HTTP status: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            error_code="$(jq -r '.error // empty | tostring | .[0:80]' "$body_file" 2>/dev/null || true)"
            echo "::error::El cron respondió HTTP $status (se esperaba 2xx) ${error_code:+error=$error_code}"
            exit 1
          fi
          if ! jq -e '.ok == true' "$body_file" > /dev/null 2>&1; then
            echo "::error::La respuesta no trae \"ok\": true"
            exit 1
          fi
          jq -c '{ok, disabled, sent, skipped, failed, total_candidates, errors: ((.errors // []) | length)}' "$body_file"
